# RAKSHAK — demo stack.
#
# Notes:
#  * The backend build context is the REPO ROOT (see `dockerfile:` below) so the
#    shared `ai/` ANPR package and `backend/models/*.pt` land next to `app/`.
#  * Inside the compose network the backend must talk to `postgres`/`redis` by
#    service name; the browser and the phone must talk to `http://<LAN IP>:8000`
#    (VITE_API_URL), because they are *not* on the Docker network.
#  * No `version:` key (obsolete in Compose v2).
name: rakshak

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rakshak}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rakshak}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # Service names, never localhost: localhost inside the container is itself.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rakshak}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      DEMO_MODE: ${DEMO_MODE:-true}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/data/uploads
      AI_MODEL_PATH: ${AI_MODEL_PATH:-}
      OCR_MODEL_PATH: ${OCR_MODEL_PATH:-}
    ports:
      - "8000:8000"
    volumes:
      # Uploaded proof images survive container rebuilds.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations first, then the API. Demo users are seeded idempotently by the
    # FastAPI lifespan; the richer demo data is seeded by scripts/start.ps1.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  citizen_web:
    build: ./citizen_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # The *browser* resolves this host, so it must be the LAN IP, not
      # `backend:8000`. scripts/start.ps1 writes this into .env.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

  police_dashboard:
    build: ./police_dashboard
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata: